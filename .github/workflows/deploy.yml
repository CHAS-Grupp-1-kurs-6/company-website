name: Deploy to K3s

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  IMAGE_URI: ghcr.io/chas-grupp-1-kurs-6/company-website

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # --- Build & push to GHCR ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_URI }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build image for security scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_URI }}:scan

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}:scan
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          skip-files: 'usr/local/lib/python3.13/site-packages/pip/_vendor/bom.cdx.json'

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # --- Generate CycloneDX SBOM ---
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_URI }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # --- Attest SBOM with Cosign ---
      - name: Attest SBOM with Cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ env.IMAGE_URI }}@${DIGEST}"

      - name: Sign image with Cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${{ env.IMAGE_URI }}@${DIGEST}"

      # --- Network connectivity to K3s node ---
      - name: Connect to Headscale Mesh
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --login-server=${{ vars.HEADSCALE_URL }}
          version: 1.102.4

      - name: Verify connectivity to K3s node
        run: |
          ping -c 3 10.0.${{ vars.TEAM_ID }}.3
          echo "Tailscale connectivity confirmed"

      # --- Configure kubectl for remote k3s ---
      - name: Configure kubeconfig (OIDC, ingen statisk nyckel)
        env:
          K3S_CA_CERT: ${{ vars.K3S_CA_CERT }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=k3s-team1" | jq -r .value)
          echo "::add-mask::$TOKEN"
          mkdir -p ~/.kube
          echo "$K3S_CA_CERT" > /tmp/k3s-ca.crt
          kubectl config set-cluster k3s --server=https://10.0.${{ vars.TEAM_ID }}.3:6443 --certificate-authority=/tmp/k3s-ca.crt --embed-certs=true
          kubectl config set-credentials github-oidc --token="$TOKEN"
          kubectl config set-context deploy --cluster=k3s --user=github-oidc --namespace=default
          kubectl config use-context deploy
          chmod 600 ~/.kube/config
          kubectl get pods -n default

      # --- Deploy to K3s ---
      - name: Apply manifests and update image
        run: |
          export DEPLOY_IMAGE="${IMAGE_URI}@${{ steps.push.outputs.digest }}"
          export GIT_COMMIT="${GITHUB_SHA::7}"
          envsubst < k8s/deployment.yaml > /tmp/deployment.yaml
          echo "=== GENERATED DEPLOYMENT ==="
          cat /tmp/deployment.yaml
          echo "=== END GENERATED DEPLOYMENT ==="
          kubectl apply -f /tmp/deployment.yaml -f k8s/pvc.yaml -f k8s/service.yaml -f k8s/ingress.yaml
          kubectl rollout status deployment/company-website --timeout=120s
