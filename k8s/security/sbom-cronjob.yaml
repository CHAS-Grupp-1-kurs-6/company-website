apiVersion: batch/v1
kind: CronJob
metadata:
  name: sbom-vulnerability-scanner
  namespace: security-tools
spec:
  concurrencyPolicy: Allow
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata: {}
    spec:
      template:
        metadata: {}
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - "set -eu\n[ -n \"${WEBHOOK_URL:-}\" ] || { echo \"[!] WEBHOOK_URL saknas\";
              exit 1; }\n\napk add --no-cache curl jq cosign\n\ncurl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.75.0/contrib/install.sh
              | sh -s -- -b /usr/local/bin v0.75.0\n\nAPISERVER=\"https://kubernetes.default.svc\"\nTOKEN=$(cat
              /var/run/secrets/kubernetes.io/serviceaccount/token)\nCA_CERT=\"/var/run/secrets/kubernetes.io/serviceaccount/ca.crt\"\n\necho
              \"[*] Inspecting namespace '${TARGET_NAMESPACE}' for label '${LABEL_SELECTOR}'...\"\nPOD_JSON=$(curl
              -s --cacert \"$CA_CERT\" -H \"Authorization: Bearer $TOKEN\" \\\n  \"$APISERVER/api/v1/namespaces/${TARGET_NAMESPACE}/pods?labelSelector=${LABEL_SELECTOR}\")\n\nIMAGE_ID=$(echo
              \"$POD_JSON\" | jq -r '.items[0].status.containerStatuses[0].imageID
              // empty')\n\nif [ -n \"$IMAGE_ID\" ]; then\n  IMAGE=$(echo \"$IMAGE_ID\"
              | sed 's|^.*://||')\n  echo \"[+] Target acquired from running pod (Digest):
              $IMAGE\"\nelse\n  echo \"[!] Warning: No active pod found. Falling back
              to: ${FALLBACK_IMAGE}\"\n  IMAGE=\"${FALLBACK_IMAGE}\"\nfi\n\ncosign
              download attestation --predicate-type=https://cyclonedx.org/bom \"$IMAGE\"
              \\\n  | jq -r .payload | base64 -d | jq .predicate > /tmp/sbom.json\n\ntrivy
              sbom /tmp/sbom.json --format json --ignore-unfixed -o /tmp/trivy-report.json\n\nHIGH_CRIT_COUNT=$(jq
              '[.Results[].Vulnerabilities[]? | select(.Severity == \"HIGH\" or .Severity
              == \"CRITICAL\")] | length' /tmp/trivy-report.json)\nif [ -z \"$HIGH_CRIT_COUNT\"
              ]; then HIGH_CRIT_COUNT=0; fi\n\nif [ \"$HIGH_CRIT_COUNT\" -eq 0 ];
              then\n  PAYLOAD='{\"embeds\": [{\n    \"title\": \"\U0001F6E1️ Supply
              Chain Scan: All Clear\",\n    \"description\": \"No High or Critical
              vulnerabilities were detected in running workload.\",\n    \"color\":
              3066993,\n    \"footer\": {\"text\": \"K3s Trivy CronJob • Automated
              Lab Check\"}\n  }]}'\n  curl -sS -o /dev/null -H \"Content-Type: application/json\"
              -X POST -d \"$PAYLOAD\" \"$WEBHOOK_URL\"\nelse\n  trivy sbom /tmp/sbom.json
              --severity HIGH,CRITICAL --ignore-unfixed > /tmp/trivy-report.txt\n
              \ PAYLOAD_JSON='{\"embeds\": [{\n    \"title\": \"\U0001F6A8 Supply
              Chain Alert: Vulnerabilities Found\",\n    \"description\": \"High/Critical
              vulnerabilities were detected. See attached report for details.\",\n
              \   \"color\": 15158332,\n    \"footer\": {\"text\": \"K3s Trivy CronJob
              • Automated Lab Check\"}\n  }]}'\n  curl -sS -o /dev/null -X POST -F
              \"payload_json=$PAYLOAD_JSON\" -F \"file=@/tmp/trivy-report.txt\" \"$WEBHOOK_URL\"\nfi\n"
            env:
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  key: discord-webhook-url
                  name: sbom-vulnerability-scanner-secrets
            - name: TARGET_NAMESPACE
              value: default
            - name: LABEL_SELECTOR
              value: app=company-website
            - name: FALLBACK_IMAGE
              value: ghcr.io/chas-grupp-1-kurs-6/company-website@sha256:b7dab40e5b0d0ab38f8f8334db6f199abea46901cb7407765562259332dd946e
            image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
            imagePullPolicy: IfNotPresent
            name: scanner
            resources: {}
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: OnFailure
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: sbom-scanner-sa
          serviceAccountName: sbom-scanner-sa
          terminationGracePeriodSeconds: 30
  schedule: 0 12 * * *
  successfulJobsHistoryLimit: 2
  suspend: false
