apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: company-website.team1.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: company-website
                port:
                  number: 7000
