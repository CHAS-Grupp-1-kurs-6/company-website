apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-website
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: company-website
  template:
    metadata:
      labels:
        app: company-website
        git.commit: "${GIT_COMMIT}"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: ${DEPLOY_IMAGE}
        ports:
        - containerPort: 7000
        env:
        - name: FLASK_DEBUG
          value: "false"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 7000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 7000
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: company-website-data
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
